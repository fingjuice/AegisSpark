# =============================================================================
# ABE-Spark 统一配置文件
# 密码学 / Native 库 / Spark 作业均由此文件集中管理。
#
# 环境变量（建议在 shell 或 spark-env.sh 中设置）：
#   ABE_SPARK_ROOT      本仓库根目录（默认见下方 paths）
#   ABE_SPARK_CONFIG    本文件绝对路径（可选，默认可自动推导）
#   ABE_SPARK_CONF_DIR  Ed25519 密钥目录（生产环境）
#   MCL_ROOT            mcl + ABE-Framework 源码根目录
#
# Spark 侧引用方式（spark-defaults.conf）：
#   spark.abe.master.config=${ABE_SPARK_ROOT}/abe-eac/conf/abe-spark.conf
#   spark.abe.enabled=true
# =============================================================================

[paths]
# 仓库与产物路径（支持 ${ENV} 展开）
abe_spark_root = ${ABE_SPARK_ROOT}
abe_eac_root = ${ABE_SPARK_ROOT}/abe-eac
config_dir = ${ABE_SPARK_ROOT}/abe-eac/conf
native_build_dir = ${ABE_SPARK_ROOT}/abe-eac/native/build
dataset_dir = ${ABE_SPARK_ROOT}/data/dataset_encrypted
hdfs_data_root = hdfs://10.26.40.83:9000/abe-bench/data
result_dir = ${ABE_SPARK_ROOT}/result/company

[native]
# mcl / ABE-Framework 构建产物（CMake 与 LD_LIBRARY_PATH）
mcl_root = ${MCL_ROOT}
mcl_build_dir = ${MCL_ROOT}/build-eac
mcl_lib_dir = ${MCL_ROOT}/build-eac/lib
jni_library_name = abe_spark_jni
jni_library_dir = ${ABE_SPARK_ROOT}/abe-eac/native/build
openssl_required = true

[curve]
# 双线性群曲线：BLS12_381 | BN254 | BN381 | SNARK1
name = BLS12_381
fp_bit = 384
fr_bit = 256

[abe]
engine = fame
scheme_id = ABE-Spark/FAME-AC17-v1

[aead]
algorithm = AES-128-GCM
key_bits = 128
nonce_bytes = 12
tag_bytes = 16

[signature]
algorithm = Ed25519
admin_private_key_path = ${ABE_SPARK_CONF_DIR}/admin_ed25519.pem
admin_public_key_path = ${ABE_SPARK_CONF_DIR}/admin_ed25519.pub
driver_private_key_path = ${ABE_SPARK_CONF_DIR}/driver_tee_ed25519.pem
driver_public_key_path = ${ABE_SPARK_CONF_DIR}/driver_tee_ed25519.pub
write_verification_private_key_path = ${ABE_SPARK_CONF_DIR}/write_verification_ed25519.pem
write_verification_public_key_path = ${ABE_SPARK_CONF_DIR}/write_verification_ed25519.pub

[tee]
# mode: sim = 进程内 FAME（开发/无 SGX 硬件）；sgx = Intel SGX Enclave 内 FAME
mode = sgx
enclave_path = ${MCL_ROOT}/sgx-enclave/build/bin/enclave.signed.so
write_verification_url = tee://write-verification:9000
driver_attestation_url = tee://write-verification:9000

[spark]
# 对应 SparkConf / Hadoop Configuration 中的 spark.abe.* 项
enabled = true
user_id = analyst_user
user_attributes = role:analyst,dept:finance
executor_native_library_path = ${MCL_ROOT}/build-eac/lib:${ABE_SPARK_ROOT}/abe-eac/native/build
# 读路径：text/json/csv 等基于 HadoopFileLinesReader 的格式
read_pipeline_enabled = true
# 写路径：Write Verification 门控（Driver 侧）
write_pipeline_enabled = true
task_ticket_ttl_sec = 2000000000

[experiment]
target_gb = 100
checkpoint_interval_gb = 10
parallel_workers = 8
tee_note = FAME CP-ABE in SGX enclave when tee.mode=sgx; in-process FAME when tee.mode=sim

[dataset]
table_prefix = company_
table_id_width = 6
records_min = 50
records_max = 300
policy_public = role:analyst
policy_sensitive = (role:admin and clearance:5)
sensitive_columns = email,phone,salary,bank_account
columns = employee_id,name,email,phone,salary,department,address,bank_account
column_widths = 16,48,64,16,12,32,96,24

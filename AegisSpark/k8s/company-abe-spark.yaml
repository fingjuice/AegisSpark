apiVersion: batch/v1
kind: Job
metadata:
  name: company-abe-spark
  namespace: spark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: "10.26.40.84"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: company-abe-benchmark
          image: docker.io/library/spark:3.2.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DRIVER_IP=$(hostname -I | awk '{print $1}')
              export ABE_SPARK_ROOT=/abe-spark
              export MCL_ROOT=/mcl
              export ABE_SPARK_CONF_DIR=/abe-conf/keys
              export ABE_SPARK_CONFIG=/abe-conf/abe-spark.conf
              export HADOOP_CONF_DIR=/etc/hadoop
              export HADOOP_HOME=/opt/hadoop
              export HADOOP_COMMON_HOME=/opt/hadoop
              export HADOOP_HDFS_HOME=/opt/hadoop
              export JAVA_HOME="${JAVA_HOME:-/opt/java/openjdk}"
              export PATH=/opt/hadoop/bin:$PATH
              export LD_LIBRARY_PATH=/native/mcl:/native/abe:/abe-spark/abe-eac/native/build:/mcl/build-eac/lib:${LD_LIBRARY_PATH:-}
              export HADOOP_USER_NAME=shanlicheng
              export TARGET_GB=${TARGET_GB:-100}
              export CHECKPOINT_GB=${CHECKPOINT_GB:-10}
              export FINE_CHECKPOINT_GB=${FINE_CHECKPOINT_GB:-0.5}
              export BENCH_MODE=${BENCH_MODE:-all}
              export RESUME_WRITE=${RESUME_WRITE:-0}
              export SPARK_CORES_MAX=${SPARK_CORES_MAX:-372}
              export SPARK_PARALLELISM=${SPARK_PARALLELISM:-${SPARK_CORES_MAX}}
              export SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-8}
              export SPARK_EXECUTOR_INSTANCES=${SPARK_EXECUTOR_INSTANCES:-46}
              export WV_FAST_VERIFY=${WV_FAST_VERIFY:-0}
              export ABE_DEK_CACHE=${ABE_DEK_CACHE:-0}
              export ABE_SHARED_DEK=${ABE_SHARED_DEK:-0}
              export ABE_TEE_MODE=${ABE_TEE_MODE:-sim}
              export MT_SIMPLE_CSV=${MT_SIMPLE_CSV:-0}
              export PER_REQ_CSV=${PER_REQ_CSV:-0}
              export XATTR_CSV=${XATTR_CSV:-0}
              export XATTR_SIZE_CSV=${XATTR_SIZE_CSV:-xattr_size.csv}
              export HDFS_DATA_ROOT=${HDFS_DATA_ROOT:-}
              export EAC_CSV=${EAC_CSV:-eac_time.csv}
              export ABE_CSV=${ABE_CSV:-abe_time.csv}
              export WRITE_CSV=${WRITE_CSV:-write_perf.csv}
              export READ_CSV=${READ_CSV:-read_perf.csv}
              export RESULT_DIR=/results-host
              mkdir -p "$RESULT_DIR"
              if [ "${RESUME_WRITE}" != "1" ]; then
                : > "$RESULT_DIR/distributed_benchmark.log"
              fi
              echo "===== resume/start $(date -Is) RESUME_WRITE=${RESUME_WRITE} sharedDek=${ABE_SHARED_DEK} dekCache=${ABE_DEK_CACHE} eacFast=${WV_FAST_VERIFY} =====" \
                >> "$RESULT_DIR/distributed_benchmark.log"

              echo "=== ABE/EAC Company Distributed Benchmark ==="
              echo "Driver=${DRIVER_IP} | cores.max=${SPARK_CORES_MAX} | parallelism=${SPARK_PARALLELISM} | executors=${SPARK_EXECUTOR_INSTANCES}x${SPARK_EXECUTOR_CORES} | RESUME_WRITE=${RESUME_WRITE} | sharedDek=${ABE_SHARED_DEK} dekCache=${ABE_DEK_CACHE} eacFast=${WV_FAST_VERIFY} teeMode=${ABE_TEE_MODE}"

              /opt/spark/bin/spark-submit \
                --master spark://10.108.117.130:7077 \
                --deploy-mode client \
                --class org.apache.spark.abe.benchmark.CompanyAbeBenchmark \
                --jars /abe-jars/spark-abe-eac_2.12-3.2.3.jar \
                --conf spark.driver.host=${DRIVER_IP} \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.driver.cores=4 \
                --conf spark.driver.memory=16g \
                --conf spark.driver.extraLibraryPath=/native/mcl:/native/abe \
                --conf spark.driver.extraJavaOptions="-Djava.library.path=/native/mcl:/native/abe" \
                --conf spark.cores.max=${SPARK_CORES_MAX} \
                --conf spark.executor.cores=${SPARK_EXECUTOR_CORES} \
                --conf spark.executor.instances=${SPARK_EXECUTOR_INSTANCES} \
                --conf spark.executor.memory=10g \
                --conf spark.executor.memoryOverhead=4g \
                --conf spark.default.parallelism=${SPARK_PARALLELISM} \
                --conf spark.sql.shuffle.partitions=${SPARK_PARALLELISM} \
                --conf spark.memory.fraction=0.8 \
                --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
                --conf spark.network.timeout=800s \
                --conf spark.executor.heartbeatInterval=60s \
                --conf spark.task.maxFailures=8 \
                --conf spark.excludeOnFailure.enabled=true \
                --conf spark.excludeOnFailure.task.maxTaskAttemptsPerNode=2 \
                --conf spark.hadoop.fs.defaultFS=hdfs://10.26.40.83:9000 \
                --conf spark.ui.enabled=false \
                --conf spark.eventLog.enabled=false \
                --conf spark.log.level=WARN \
                --conf spark.abe.enabled=true \
                --conf spark.abe.master.config=/abe-conf/abe-spark.conf \
                --conf spark.abe.user.id=analyst_user \
                --conf spark.abe.user.attributes=role:analyst,dept:finance \
                --conf spark.executor.extraLibraryPath=/native/mcl:/native/abe:/abe-spark/abe-eac/native/build:/mcl/build-eac/lib \
                --conf spark.executor.extraJavaOptions="-Djava.library.path=/native/mcl:/native/abe:/abe-spark/abe-eac/native/build:/mcl/build-eac/lib" \
                --conf spark.executorEnv.ABE_SPARK_ROOT=/abe-spark \
                --conf spark.executorEnv.MCL_ROOT=/mcl \
                --conf spark.executorEnv.ABE_SPARK_CONF_DIR=/abe-conf/keys \
                --conf spark.executorEnv.ABE_SPARK_CONFIG=/abe-conf/abe-spark.conf \
                --conf spark.executorEnv.ABE_TEE_MODE=${ABE_TEE_MODE} \
                --conf spark.executorEnv.LD_LIBRARY_PATH=/native/mcl:/native/abe:/abe-spark/abe-eac/native/build:/mcl/build-eac/lib \
                --conf spark.executorEnv.HADOOP_USER_NAME=shanlicheng \
                --conf spark.executorEnv.HADOOP_CONF_DIR=/etc/hadoop \
                /abe-jars/spark-abe-eac_2.12-3.2.3.jar \
                >> "$RESULT_DIR/distributed_benchmark.log" 2>&1

              echo "Benchmark finished, results in $RESULT_DIR"
          env:
            - name: TARGET_GB
              value: "100"
            - name: CHECKPOINT_GB
              value: "10"
            - name: FINE_CHECKPOINT_GB
              value: "0.5"
            - name: BENCH_MODE
              value: "read"
            - name: RESUME_WRITE
              value: "0"
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
            limits:
              cpu: "16"
              memory: "48Gi"
          volumeMounts:
            - name: abe-jars
              mountPath: /abe-jars
              readOnly: true
            - name: abe-conf
              mountPath: /abe-conf
              readOnly: true
            - name: abe-native
              mountPath: /native/abe
              readOnly: true
            - name: mcl-native
              mountPath: /native/mcl
              readOnly: true
            - name: abe-spark-root
              mountPath: /abe-spark
              readOnly: true
            - name: mcl-root
              mountPath: /mcl
              readOnly: true
            - name: hadoop-conf
              mountPath: /etc/hadoop
              readOnly: true
            - name: hadoop-home
              mountPath: /opt/hadoop
              readOnly: true
            - name: results-host
              mountPath: /results-host
      volumes:
        - name: abe-jars
          hostPath:
            path: /home/shanlicheng/test-benchmark/ABE-Spark/abe-eac/target
            type: Directory
        - name: abe-conf
          hostPath:
            path: /home/shanlicheng/test-benchmark/ABE-Spark/abe-eac/conf
            type: Directory
        - name: abe-native
          hostPath:
            path: /home/shanlicheng/test-benchmark/ABE-Spark/abe-eac/native/build
            type: Directory
        - name: mcl-native
          hostPath:
            path: /home/shanlicheng/mcl/build-eac/lib
            type: Directory
        - name: abe-spark-root
          hostPath:
            path: /home/shanlicheng/test-benchmark/ABE-Spark
            type: Directory
        - name: mcl-root
          hostPath:
            path: /home/shanlicheng/mcl
            type: Directory
        - name: hadoop-conf
          hostPath:
            path: /home/shanlicheng/opt/hadoop/etc/hadoop
            type: Directory
        - name: hadoop-home
          hostPath:
            path: /home/shanlicheng/opt/hadoop
            type: Directory
        - name: results-host
          hostPath:
            path: /home/shanlicheng/test-benchmark/ABE-Spark/result/company
            type: DirectoryOrCreate

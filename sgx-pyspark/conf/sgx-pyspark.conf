# =============================================================================
# sgx-pyspark 统一配置文件（design.md 架构）
# LibOS: Occlum
# =============================================================================

[paths]
sgx_pyspark_root = ${SGX_PYSPARK_ROOT}
data_dir = ${SGX_PYSPARK_ROOT}/data
keys_dir = ${SGX_PYSPARK_ROOT}/conf/keys
hdfs_data_root = hdfs://10.26.40.83:9000/sgx-pyspark/data

[native]
abe_spark_root = ${ABE_SPARK_ROOT}
mcl_root = ${MCL_ROOT}
mcl_lib_dir = ${MCL_ROOT}/build-eac/lib
ffi_library_name = sgx_pyspark_ffi
ffi_library_dir = ${SGX_PYSPARK_ROOT}/native/build

[signature]
algorithm = ECDSA-P256-SHA256
admin_private_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/admin_ecdsa.pem
admin_public_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/admin_ecdsa.pub
driver_private_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/driver_tee_ecdsa.pem
driver_public_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/driver_tee_ecdsa.pub
write_verification_private_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/write_verification_ecdsa.pem
write_verification_public_key_path = ${SGX_PYSPARK_ROOT}/conf/keys/write_verification_ecdsa.pub

[tee]
libos = occlum
tee_mode = sim
monotonic_counter_namespace = sgx-pyspark-wv
write_verification_url = tee://write-verification:9000
occlum_instance_dir = ${SGX_PYSPARK_ROOT}/occlum/instance

[spark]
enabled = true
user_id = analyst_user
user_attributes = role:analyst
task_ticket_ttl_sec = 86400

[dataset]
policy_public = role:analyst
policy_sensitive = (role:admin and clearance:5)
sensitive_columns = email,phone,salary,bank_account
columns = employee_id,name,email,phone,salary,department,address,bank_account

[experiment]
target_gb = 100
checkpoint_interval_gb = 10
parallel_workers = 32
result_dir = ${SGX_PYSPARK_ROOT}/Experimental-Result
